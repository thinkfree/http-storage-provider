server.address=${TFO_STORAGE_HOST:127.0.0.1}
server.port=${TFO_STORAGE_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
tfo.storage.root=${TFO_STORAGE_ROOT:./storage}
tfo.storage.root-name=${TFO_STORAGE_ROOT_NAME:Documents}
tfo.storage.adapter=${TFO_STORAGE_ADAPTER:}
tfo.storage.request-jwt-secret=${TFO_STORAGE_REQUEST_JWT_SECRET:}
tfo.storage.max-document-bytes=${TFO_STORAGE_MAX_DOCUMENT_BYTES:536870912}
tfo.storage.unsupported-operations=${TFO_STORAGE_UNSUPPORTED_OPERATIONS:}
