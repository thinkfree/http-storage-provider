name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build -t thinkfree-http-storage-provider:check .

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn --batch-mode test
      - run: mvn --batch-mode -DskipTests package

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            examples/python/requirements.txt
            examples/python/requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest -v

  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OOXML samples
        run: |
          for extension in docx xlsx pptx; do
            test "$(sha256sum storage/samples/sample.$extension | cut -d' ' -f1)" = \
              "$(sha256sum examples/java/storage/samples/sample.$extension | cut -d' ' -f1)"
            test "$(sha256sum storage/samples/sample.$extension | cut -d' ' -f1)" = \
              "$(sha256sum examples/python/storage/samples/sample.$extension | cut -d' ' -f1)"
          done
          for file in storage/samples/* examples/java/storage/samples/* examples/python/storage/samples/*; do
            unzip -tq "$file" >/dev/null
          done
